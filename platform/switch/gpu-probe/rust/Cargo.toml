[package]
name = "craftrustnx-gpu-probe"
version = "0.1.0"
edition = "2021"
description = "Standalone no_std frame/control logic for the Switch GPU triangle smoke test"

[lib]
name = "craftrustnx_gpu_probe"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]

[features]
default = []

[profile.release]
panic = "abort"
debug = 0
lto = false
codegen-units = 1

[profile.dev]
panic = "abort"
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Standalone Switch experiment; never joins the Horizon game workspace.
[workspace]
