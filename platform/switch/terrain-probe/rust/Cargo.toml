[package]
name = "craftrustnx-terrain-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
libm = "=0.2.16"

[features]
textured = []

[profile.release]
panic = "abort"
debug = 0
lto = false
codegen-units = 1

[profile.dev]
panic = "abort"
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
