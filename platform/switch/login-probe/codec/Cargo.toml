[package]
name = "craftrustnx-login-codec"
version = "0.1.0"
edition = "2021"
description = "Bounded no_std Java 26.3 (protocol 777) login diagnostic codec for the Switch probe"

[lib]
name = "craftrustnx_login_codec"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
# Cached in the local registry; no allocation (`with-alloc` off), no network.
miniz_oxide = { version = "=0.8.9", default-features = false }

[features]
default = []

[profile.release]
panic = "abort"
debug = 0
lto = false
codegen-units = 1

[profile.dev]
panic = "abort"

# Standalone workspace: never joins the Horizon game workspace.
[workspace]

[profile.test]
debug = 0
incremental = false
